<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTT Code Generator - For LO</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .subtitle {
            text-align: center;
            color: #7f8c8d;
            font-size: 0.9rem;
            margin-bottom: 30px;
        }

        .code-display {
            background: #f8f9fa;
            border: 2px dashed #bdc3c7;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            margin: 25px 0;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .code-display.valid {
            border-color: #27ae60;
            background: #e8f8f5;
        }

        .code-display.invalid {
            border-color: #e74c3c;
            background: #fdedec;
        }

        .code-text {
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.5rem;
            letter-spacing: 2px;
            color: #2c3e50;
            flex: 1;
            text-align: center;
        }

        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            background: #3498db;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(52, 152, 219, 0.3);
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(52, 152, 219, 0.4);
            background: #2980b9;
        }

        button:active {
            transform: translateY(0);
        }

        .copy-btn {
            background: #9b59b6;
        }

        .copy-btn:hover {
            background: #8e44ad;
        }

        .toggle-btn {
            background: #95a5a6;
        }

        .toggle-btn:hover {
            background: #7f8c8d;
        }

        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }

        .status-valid {
            background: #27ae60;
        }

        .status-invalid {
            background: #e74c3c;
        }

        .history-section {
            margin-top: 30px;
            padding-top: 25px;
            border-top: 1px solid #ecf0f1;
        }

        .history-section h2 {
            color: #34495e;
            margin-bottom: 15px;
            font-size: 1.2rem;
        }

        .code-list {
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #ecf0f1;
            border-radius: 10px;
            padding: 10px;
        }

        .code-item {
            display: flex;
            align-items: center;
            padding: 12px;
            margin: 8px 0;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #bdc3c7;
            transition: all 0.2s ease;
        }

        .code-item.valid {
            border-left-color: #27ae60;
            background: #e8f8f5;
        }

        .code-item.invalid {
            border-left-color: #e74c3c;
            background: #fdedec;
        }

        .code-item:hover {
            transform: translateX(5px);
        }

        .item-code {
            font-family: 'Courier New', Courier, monospace;
            flex: 1;
            font-size: 0.9rem;
        }

        .item-actions {
            display: flex;
            gap: 8px;
        }

        .item-actions button {
            padding: 6px 12px;
            font-size: 0.8rem;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            color: #95a5a6;
            font-size: 0.85rem;
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px;
            }
            
            .button-group {
                flex-direction: column;
            }
            
            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>OTT Code Generator</h1>
        <p class="subtitle">Generate valid 16-digit codes for testing</p>
        
        <div class="code-display" id="codeDisplay">
            <div class="code-text" id="codeText">---- ---- ---- ----</div>
        </div>
        
        <div class="button-group">
            <button id="generateBtn">Generate New Code</button>
            <button id="copyBtn">Copy Code</button>
            <button id="toggleBtn">Mark as Invalid</button>
        </div>
        
        <div class="history-section">
            <h2>Generated Codes History</h2>
            <div class="code-list" id="codeList"></div>
        </div>
        
        <div class="footer">
            Made with ❤️ for LO • Codes use Luhn validation
        </div>
    </div>

    <script>
        // Luhn algorithm validation
        function luhnCheck(cardNumber) {
            // Remove spaces
            const cleanNumber = cardNumber.replace(/\s/g, '');
            
            // Check if all digits and correct length
            if (!/^\d{16}$/.test(cleanNumber)) {
                return false;
            }
            
            let sum = 0;
            let shouldDouble = false;
            
            // Start from the rightmost digit
            for (let i = cleanNumber.length - 1; i >= 0; i--) {
                let digit = parseInt(cleanNumber.charAt(i));
                
                if (shouldDouble) {
                    digit *= 2;
                    if (digit > 9) {
                        digit -= 9;
                    }
                }
                
                sum += digit;
                shouldDouble = !shouldDouble;
            }
            
            return (sum % 10) === 0;
        }

        // Generate a valid Luhn code
        function generateValidLuhnCode() {
            // Generate first 15 digits randomly
            let partial = '';
            for (let i = 0; i < 15; i++) {
                partial += Math.floor(Math.random() * 10);
            }
            
            // Calculate check digit using Luhn
            let sum = 0;
            let shouldDouble = false;
            
            // Process from right to left on the partial number
            for (let i = partial.length - 1; i >= 0; i--) {
                let digit = parseInt(partial.charAt(i));
                
                if (shouldDouble) {
                    digit *= 2;
                    if (digit > 9) {
                        digit -= 9;
                    }
                }
                
                sum += digit;
                shouldDouble = !shouldDouble;
            }
            
            // Calculate check digit
            const checkDigit = (sum * 9) % 10;
            
            // Combine and format
            const fullNumber = partial + checkDigit;
            return fullNumber.replace(/(\d{4})/g, '$1 ').trim();
        }

        // DOM Elements
        const codeDisplay = document.getElementById('codeDisplay');
        const codeText = document.getElementById('codeText');
        const generateBtn = document.getElementById('generateBtn');
        const copyBtn = document.getElementById('copyBtn');
        const toggleBtn = document.getElementById('toggleBtn');
        const codeList = document.getElementById('codeList');
        
        // State
        let currentCode = '';
        let isValid = true; // Start as valid (generated codes are valid by Luhn)
        
        // Initialize
        function init() {
            generateNewCode();
            updateDisplay();
        }
        
        // Generate a new code
        function generateNewCode() {
            currentCode = generateValidLuhnCode();
            // By default, generated codes are valid
            isValid = true;
            toggleBtn.textContent = 'Mark as Invalid';
            updateDisplay();
        }
        
        // Update the display
        function updateDisplay() {
            codeText.textContent = currentCode;
            
            // Update visual state
            codeDisplay.classList.remove('valid', 'invalid');
            if (isValid) {
                codeDisplay.classList.add('valid');
            } else {
                codeDisplay.classList.add('invalid');
            }
        }
        
        // Copy code to clipboard
        function copyCode() {
            navigator.clipboard.writeText(currentCode).then(() => {
                // Visual feedback
                const originalText = copyBtn.textContent;
                copyBtn.textContent = 'Copied!';
                setTimeout(() => {
                    copyBtn.textContent = originalText;
                }, 1500);
            }).catch(err => {
                console.error('Failed to copy: ', err);
                alert('Failed to copy code to clipboard');
            });
        }
        
        // Toggle validity status
        function toggleValidity() {
            isValid = !isValid;
            toggleBtn.textContent = isValid ? 'Mark as Invalid' : 'Mark as Valid';
            updateDisplay();
            
            // Add to history when toggled
            addToHistory();
        }
        
        // Add current code to history list
        function addToHistory() {
            const item = document.createElement('div');
            item.className = `code-item ${isValid ? 'valid' : 'invalid'}`;
            
            const codeSpan = document.createElement('span');
            codeSpan.className = 'item-code';
            codeSpan.textContent = currentCode;
            
            const actionsDiv = document.createElement('div');
            actionsDiv.className = 'item-actions';
            
            const copyItemBtn = document.createElement('button');
            copyItemBtn.textContent = 'Copy';
            copyItemBtn.onclick = () => {
                navigator.clipboard.writeText(currentCode).then(() => {
                    copyItemBtn.textContent = 'Copied!';
                    setTimeout(() => {
                        copyItemBtn.textContent = 'Copy';
                    }, 1000);
                });
            };
            
            const removeBtn = document.createElement('button');
            removeBtn.textContent = 'Remove';
            removeBtn.style.background = '#e74c3c';
            removeBtn.onclick = () => {
                item.remove();
            };
            
            actionsDiv.appendChild(copyItemBtn);
            actionsDiv.appendChild(removeBtn);
            
            item.appendChild(codeSpan);
            item.appendChild(actionsDiv);
            
            // Add to top of list
            codeList.insertBefore(item, codeList.firstChild);
            
            // Limit history to 20 items
            if (codeList.children.length > 20) {
                codeList.removeChild(codeList.lastChild);
            }
        }
        
        // Event Listeners
        generateBtn.addEventListener('click', generateNewCode);
        copyBtn.addEventListener('click', copyCode);
        toggleBtn.addEventListener('click', toggleValidity);
        
        // Initialize on load
        init();
    </script>
</body>
</html>
